# Secret：敏感信息。按"谁需要什么"拆成三份，最小权限原则

# 注意：stringData 里的值仍然是开发环境的明文（base64 不是加密，只是编码），
# 真正的生产做法是 sealed-secrets / external-secrets / 云 KMS，绝不进 Git。
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: wsk-auto
type: Opaque
stringData:
  MYSQL_USER: "wsk"
  MYSQL_PASSWORD: "wsk-local-db"
---
apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
  namespace: wsk-auto
type: Opaque
stringData:
  JWT_SECRET: "wsk-local-only-change-before-production"
---
apiVersion: v1
kind: Secret
metadata:
  name: mysql-root
  namespace: wsk-auto
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "wsk-local-root"
